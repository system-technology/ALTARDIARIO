  - id: T-073
    title: Auditor autónomo del ciclo (scripts/auditor.mjs) que sustituye al auditor humano
    type: feature
    phase: 1
    priority: P1
    effort: M
    status: done
    depends_on: []
    acceptance:
      - scripts/auditor.mjs es un proceso continuo como scripts/ciclo.mjs (node scripts/auditor.mjs), con
        latido en sesiones/auditor-auto/latido.txt, STOP global respetado, un ciclo cada
        auditor.minutosEntreCiclos (por defecto 90) y un registro sesiones/auditor-auto/ciclo.log
      - "Fase 1 DETERMINISTA (sin modelo) que recoge una instantánea JSON: estado y latido de cada supervisor
        (ciclo-estado), últimas líneas de ciclo.log y *-err.log, PRs abiertos con su mergeStateStatus y
        checks, git log de origin/main desde la última revisión, fallos seguidos, procesos opencode huérfanos"
      - "Detectores deterministas con una regla cada uno y una prueba cada uno: supervisor sin latido más de
        40 min; fallos seguidos mayor o igual que 2; PR con auto-merge BEHIND o DIRTY más de 2 h; PR con
        checks rojos; mismo ciclo «no hay tarea libre» 4 veces seguidas; errores de cuota o límite (429, Free
        usage limit, Invalid API Key, expired) repetidos; ficheros prohibidos, secretos (reutiliza
        scripts/escanear-secretos.mjs) o tests borrados en commits nuevos de main"
      - "Acciones deterministas permitidas SOLO estas: reiniciar un supervisor caído (spawn desacoplado de
        node scripts/ciclo.mjs <carril> con la salida a sus proceso.log), crear sesiones/STOP ante secretos en
        main o fallos seguidos mayor o igual que 3 en ambos carriles, y escribir el informe; NUNCA aprobar,
        mergear, tocar secretos, protección de ramas ni .github (lista blanca comprobada por una prueba)"
      - "Fase 2 con modelo (opencode run --auto como las demás sesiones, modelos de auditor.modelo en
        ciclo.config.json con respaldo en cascada) que lee la instantánea y los detectores y devuelve JSON:
        diagnóstico por problema y tareas propuestas; las tareas se validan con el mismo validador que la
        auditoría de roadmap (un solo carril, rutas existentes, criterios verificables) y se publican en un PR
        de roadmap con la app Integradora y auto-merge"
      - Cada ciclo añade una entrada breve y factual con la hora a sesiones/INFORME-AUDITOR.md citando la
        línea de log que prueba cada problema; si no hay novedades, una sola línea
      - "Escalada: si un problema persiste 3 ciclos seguidos sin resolverse o el auditor detecta algo que no
        puede resolver con sus acciones permitidas, escribe sesiones/ESCALADA.md con el problema, la evidencia
        y lo que necesita (Owner o auditor externo) y lo repite cada ciclo hasta que se resuelva"
      - Se ejecuta con node scripts/auditor.mjs --una-vez para un único ciclo y node scripts/auditor.mjs
        --simulacro para no actuar (solo informa); node --test scripts/auditor.test.mjs cubre detectores,
        lista blanca de acciones y validación de tareas propuestas con dobles de gh y git
    files:
      - scripts/auditor.mjs
      - scripts/auditor.test.mjs
    source: auditoria-claude:2026-10-24
    created_at: 2026-10-24T16:00:00.000Z
